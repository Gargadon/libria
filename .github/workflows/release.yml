name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            arch: universal
            target: mac
          # Windows
          - os: windows-latest
            arch: x64
            target: win
          - os: windows-latest
            arch: arm64
            target: win
          # Linux
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: ubuntu-latest
            arch: arm64
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools liblzma-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate .icns icon (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icon.iconset
          sips -z 16   16   build/icon-512.png --out build/icon.iconset/icon_16x16.png
          sips -z 32   32   build/icon-512.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build/icon-512.png --out build/icon.iconset/icon_32x32.png
          sips -z 64   64   build/icon-512.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build/icon-512.png --out build/icon.iconset/icon_128x128.png
          sips -z 256  256  build/icon-512.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build/icon-512.png --out build/icon.iconset/icon_256x256.png
          sips -z 512  512  build/icon-512.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build/icon-512.png --out build/icon.iconset/icon_512x512.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build Angular
        run: bun run build

      - name: Build and Publish Electron
        run: bunx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
