name: CI and Release Tauri

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Release Tauri' || 'CI' }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
          - os: macos-15-intel
            platform: macos-x64
            bundles: dmg
          - os: macos-15
            platform: macos-arm64
            bundles: dmg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('El tag debe ser ' + expected); process.exit(1); }"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev ghostscript
      - name: Install Ghostscript (macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        run: brew install ghostscript
      - name: Prepare Ghostscript (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        run: bun run download:gs:win
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Synchronize application version
        run: bun run version:sync
      - name: Test Angular
        run: bun run test -- --watch=false
      - name: Test PDF worker and credentials
        run: bun run test:desktop
      - name: Test native backend
        run: bun run test:native
      - name: Check Angular production build
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: bun run build
      - name: Build Tauri installers
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # linuxdeploy's bundled strip cannot handle some modern ELF sections
          # in Ubuntu 24.04 libraries. Keep those libraries intact in AppImages.
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bun run tauri:build -- --verbose --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: libria-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          find release -type f -exec gh release upload "$RELEASE_TAG" {} --clobber \;
