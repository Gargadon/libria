name: CI and Release Tauri

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Release Tauri' || 'CI' }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            arch: x64
            bundles: nsis
          - os: windows-11-arm
            platform: windows-arm64
            arch: arm64
            toolchain: stable-aarch64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            arch: x64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            bundles: deb,appimage
          - os: macos-15-intel
            platform: macos-x64
            arch: x64
            bundles: dmg
          - os: macos-15
            platform: macos-arm64
            arch: arm64
            bundles: dmg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { console.error('El tag debe ser ' + expected); process.exit(1); }"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}
      - name: Verify native build architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e "const {execFileSync} = require('node:child_process'); const expected = process.env.EXPECTED_ARCH; const rustArch = expected === 'arm64' ? 'aarch64' : 'x86_64'; const rust = execFileSync('rustc', ['-vV'], {encoding:'utf8'}); if (process.arch !== expected || !rust.includes('host: ' + rustArch + '-')) throw new Error('Node y Rust deben usar la arquitectura ' + expected); console.log('Arquitectura nativa verificada: ' + expected);"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev ghostscript
      - name: Install Ghostscript (macOS)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        run: brew install ghostscript
      - name: Prepare Ghostscript (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        timeout-minutes: 10
        run: bun run download:gs:win
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Synchronize application version
        run: bun run version:sync
      - name: Test Angular
        run: bun run test -- --watch=false
      - name: Test PDF worker and credentials
        run: bun run test:desktop
      - name: Test native backend
        run: bun run test:native
      - name: Check Angular production build
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: bun run build
      - name: Build Tauri installers
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # linuxdeploy's bundled strip cannot handle some modern ELF sections
          # in Ubuntu 24.04 libraries. Keep those libraries intact in AppImages.
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bun run tauri:build -- --verbose --bundles ${{ matrix.bundles }}
      - name: Verify packaged PDF runtime
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 5
        run: node scripts/smoke-pdf-runtime.mjs
      - name: Stage installer artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/stage-installers.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: libria-${{ matrix.platform }}
          path: dist/installers/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          find release -type f -print0 | sort -z | xargs -0 sha256sum | sed 's|  .*/|  |' > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG — Cervantes Edition" --notes-from-tag
          fi
          find release -type f -exec gh release upload "$RELEASE_TAG" {} --clobber \;
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
